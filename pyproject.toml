[project]
name = "sandiraksa"
version = "0.2.2"
description = "SandiRaksa — Local Privacy Gateway for AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "SandiRaksa Team" }
]
keywords = ["privacy", "pii", "data-protection", "document-processing", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: General",
]

dependencies = [
    "PySide6>=6.6.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "lxml>=5.0.0",
    "defusedxml>=0.7.1",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.5.0",
    "charset-normalizer>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.3.0",
    "hypothesis>=6.92.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
build = [
    "Nuitka>=2.0.0",
]

[project.scripts]
sandiraksa = "sandiraksa.__main__:main"

[project.gui-scripts]
sandiraksa-gui = "sandiraksa.__main__:main"

[project.urls]
Homepage = "https://sandiraksa.infosecguru.id"
Documentation = "https://sandiraksa.infosecguru.id/docs"
Repository = "https://github.com/yuanyudistira/sandiraksa"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandiraksa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "S101",   # Use of assert detected (OK in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["sandiraksa"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "spacy.*",
    "openpyxl.*",
    "docx.*",
    "pptx.*",
    "keyring.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "security: marks security-related tests",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src/sandiraksa"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
