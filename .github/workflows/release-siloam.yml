name: SILOAM Windows Build (unsigned)

# Unsigned Windows build for the SILOAM-branded variant, ready to deploy via
# an MSFT Intune / Company Portal package.
#
# Produces two downloadable artifacts:
#   * SandiRaksa-siloam-unsigned          -> dist\SandiRaksa.exe (raw app)
#   * SandiRaksa-siloam-installer-unsigned-> SandiRaksa-Setup-<version>.exe
#     (Inno Setup installer built from the unsigned dist\ app)
#
# No code signing is performed. Distributing via Company Portal avoids the
# SmartScreen/Defender prompts that unsigned binaries normally trigger for
# end users. Add signing later (see release-windows.yml) once approved.

on:
  push:
    branches:
      - siloam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SILOAM Windows EXE + installer (unsigned)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if (Test-Path "requirements-build.txt") {
              pip install -r requirements-build.txt
          } else {
              pip install pyinstaller
          }
          # spaCy English model must be present so the frozen app can load NLP.
          python -m spacy download en_core_web_sm

      - name: Resolve application version
        shell: powershell
        run: |
          $verLine = Select-String -Path "src\sandiraksa\version.py" `
              -Pattern '__version__\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($verLine) {
              $version = $verLine.Matches[0].Groups[1].Value
          } else {
              $version = "0.0.0-dev"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "SETUP_FILENAME=SandiRaksa-Setup-$version.exe" >> $env:GITHUB_ENV
          Write-Host "App version: $version"

      - name: Build SandiRaksa application
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm SandiRaksa.spec
          if (-not (Test-Path "dist\SandiRaksa.exe")) {
              throw "Expected executable was not generated: dist\SandiRaksa.exe"
          }
          $info = Get-Item "dist\SandiRaksa.exe"
          $sizeMB = [math]::Round($info.Length / 1MB, 2)
          Write-Host "Built dist\SandiRaksa.exe ($sizeMB MB)"

      - name: Upload SILOAM EXE (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: SandiRaksa-siloam-unsigned
          path: dist/SandiRaksa.exe
          if-no-files-found: error

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          Write-Host "Inno Setup compiler: $($iscc.Source)"

      - name: Build Windows installer (from unsigned dist app)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "installer-output" | Out-Null
          # Point the installer at the unsigned dist/ build (no signing step).
          $appDir = (Resolve-Path "dist").Path
          & ISCC.exe "/DAppVersion=$env:APP_VERSION" "/DSignedAppDir=$appDir" "installer\SandiRaksa.iss"
          $installer = "installer-output\$env:SETUP_FILENAME"
          if (-not (Test-Path $installer)) {
              throw "Expected installer was not generated: $installer"
          }
          $info = Get-Item $installer
          $sizeMB = [math]::Round($info.Length / 1MB, 2)
          Write-Host "Built installer: $installer ($sizeMB MB)"

      - name: Upload SILOAM installer (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: SandiRaksa-siloam-installer-unsigned
          path: installer-output/${{ env.SETUP_FILENAME }}
          if-no-files-found: error
