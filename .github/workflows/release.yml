name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.2.0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
          python -m spacy download en_core_web_sm

      - name: Build executable
        run: |
          pyinstaller SandiRaksa.spec --noconfirm
      
      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Windows installer (unsigned)
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          New-Item -ItemType Directory -Force -Path "installer-output" | Out-Null
          $appDir = (Resolve-Path "dist").Path
          & ISCC.exe "/DAppVersion=${{ steps.version.outputs.version }}" "/DSignedAppDir=$appDir" "installer\SandiRaksa.iss"
          $setup = "installer-output\SandiRaksa-Setup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $setup)) { throw "Expected installer was not generated: $setup" }
          Write-Host "Built installer: $setup"

      - name: Rename executable
        run: |
          Move-Item dist/SandiRaksa.exe "dist/SandiRaksa-${{ steps.version.outputs.version }}-windows-x64.exe"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/SandiRaksa-${{ steps.version.outputs.version }}-windows-x64.exe
            installer-output/SandiRaksa-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 5

  create-release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: List artifacts
        run: find artifacts -type f
      
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: SandiRaksa v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/windows-build/*
          body: |
            ## SandiRaksa v${{ steps.version.outputs.version }}
            
            ### Downloads
            
            | Platform | Type | File |
            |----------|------|------|
            | Windows x64 | Installer (recommended) | `SandiRaksa-Setup-${{ steps.version.outputs.version }}.exe` |
            | Windows x64 | Portable executable | `SandiRaksa-${{ steps.version.outputs.version }}-windows-x64.exe` |
            
            ### Installation
            
            **Windows (installer, recommended):**
            1. Download `SandiRaksa-Setup-${{ steps.version.outputs.version }}.exe`
            2. Run it. It installs to Program Files and creates Start Menu, desktop, and Quick Launch shortcuts.
            3. If Windows Defender warns, click "More info" → "Run anyway" (the build is unsigned).
            
            **Windows (portable):**
            1. Download `SandiRaksa-${{ steps.version.outputs.version }}-windows-x64.exe`
            2. Run it directly (no installation, no shortcuts).
            
            ### What's New
            
            See [CHANGELOG.md](https://github.com/yuanyudistira/sandiraksa/blob/main/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
