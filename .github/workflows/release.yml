name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          pip install nuitka

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Build with Nuitka
        run: python scripts/build_nuitka.py --platform windows --output dist/windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandiRaksa-Windows
          path: dist/windows/SandiRaksa.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          pip install nuitka

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Build with Nuitka
        run: python scripts/build_nuitka.py --platform macos --output dist/macos

      - name: Create DMG (optional)
        run: |
          if [ -d "dist/macos/SandiRaksa.app" ]; then
            hdiutil create -volname SandiRaksa -srcfolder dist/macos/SandiRaksa.app -ov -format UDZO dist/macos/SandiRaksa.dmg
          fi
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandiRaksa-macOS
          path: dist/macos/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          pip install nuitka

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Build with Nuitka
        run: python scripts/build_nuitka.py --platform linux --output dist/linux

      - name: Create tarball
        run: |
          cd dist/linux
          tar -czvf ../SandiRaksa-Linux.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandiRaksa-Linux
          path: dist/SandiRaksa-Linux.tar.gz

  release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/SandiRaksa-Windows/SandiRaksa.exe
            artifacts/SandiRaksa-Linux/SandiRaksa-Linux.tar.gz
            artifacts/SandiRaksa-macOS/*
          body: |
            ## SandiRaksa ${{ github.ref_name }}
            
            ### Downloads
            - **Windows**: `SandiRaksa.exe`
            - **macOS**: `SandiRaksa.app` or `SandiRaksa.dmg`
            - **Linux**: `SandiRaksa-Linux.tar.gz`
            
            ### Changelog
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
