name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.2.0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      
      - name: Build executable
        run: |
          pyinstaller --name SandiRaksa `
            --windowed `
            --onefile `
            --add-data "src/sandiraksa/resources;sandiraksa/resources" `
            --hidden-import=PySide6.QtSvg `
            --hidden-import=PySide6.QtXml `
            --hidden-import=presidio_analyzer `
            --hidden-import=presidio_anonymizer `
            --hidden-import=spacy `
            --hidden-import=openpyxl `
            --hidden-import=docx `
            --hidden-import=pptx `
            --hidden-import=cryptography `
            --hidden-import=keyring `
            --hidden-import=charset_normalizer `
            --collect-all=presidio_analyzer `
            --noconfirm `
            src/sandiraksa/__main__.py
      
      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Rename executable
        run: |
          Move-Item dist/SandiRaksa.exe "dist/SandiRaksa-${{ steps.version.outputs.version }}-windows-x64.exe"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          retention-days: 5

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-13  # Intel Mac
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      
      - name: Build executable
        run: |
          pyinstaller --name SandiRaksa \
            --windowed \
            --onefile \
            --add-data "src/sandiraksa/resources:sandiraksa/resources" \
            --hidden-import=PySide6.QtSvg \
            --hidden-import=PySide6.QtXml \
            --hidden-import=presidio_analyzer \
            --hidden-import=presidio_anonymizer \
            --hidden-import=spacy \
            --hidden-import=openpyxl \
            --hidden-import=docx \
            --hidden-import=pptx \
            --hidden-import=cryptography \
            --hidden-import=keyring \
            --hidden-import=charset_normalizer \
            --collect-all=presidio_analyzer \
            --osx-bundle-identifier=id.infosecguru.sandiraksa \
            --noconfirm \
            src/sandiraksa/__main__.py
      
      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create DMG
        run: |
          # Install create-dmg
          brew install create-dmg
          
          # Clear quarantine
          xattr -cr dist/SandiRaksa || true
          
          # Create DMG
          create-dmg \
            --volname "SandiRaksa" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "dist/SandiRaksa-${{ steps.version.outputs.version }}-macos-x64.dmg" \
            "dist/SandiRaksa" || true
          
          # Fallback: zip if DMG fails
          if [ ! -f "dist/SandiRaksa-${{ steps.version.outputs.version }}-macos-x64.dmg" ]; then
            cd dist && zip -r "SandiRaksa-${{ steps.version.outputs.version }}-macos-x64.zip" SandiRaksa
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-build
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 5

  build-macos-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14  # Apple Silicon Mac
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      
      - name: Build executable
        run: |
          pyinstaller --name SandiRaksa \
            --windowed \
            --onefile \
            --add-data "src/sandiraksa/resources:sandiraksa/resources" \
            --hidden-import=PySide6.QtSvg \
            --hidden-import=PySide6.QtXml \
            --hidden-import=presidio_analyzer \
            --hidden-import=presidio_anonymizer \
            --hidden-import=spacy \
            --hidden-import=openpyxl \
            --hidden-import=docx \
            --hidden-import=pptx \
            --hidden-import=cryptography \
            --hidden-import=keyring \
            --hidden-import=charset_normalizer \
            --collect-all=presidio_analyzer \
            --osx-bundle-identifier=id.infosecguru.sandiraksa \
            --noconfirm \
            src/sandiraksa/__main__.py
      
      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create DMG
        run: |
          brew install create-dmg
          xattr -cr dist/SandiRaksa || true
          
          create-dmg \
            --volname "SandiRaksa" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "dist/SandiRaksa-${{ steps.version.outputs.version }}-macos-arm64.dmg" \
            "dist/SandiRaksa" || true
          
          if [ ! -f "dist/SandiRaksa-${{ steps.version.outputs.version }}-macos-arm64.dmg" ]; then
            cd dist && zip -r "SandiRaksa-${{ steps.version.outputs.version }}-macos-arm64.zip" SandiRaksa
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-build
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 5

  create-release:
    name: Create Release
    needs: [build-windows, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: List artifacts
        run: find artifacts -type f
      
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: SandiRaksa v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/windows-build/*
            artifacts/macos-intel-build/*
            artifacts/macos-arm-build/*
          body: |
            ## SandiRaksa v${{ steps.version.outputs.version }}
            
            ### Downloads
            
            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | x64 | `SandiRaksa-${{ steps.version.outputs.version }}-windows-x64.exe` |
            | macOS | Intel (x64) | `SandiRaksa-${{ steps.version.outputs.version }}-macos-x64.dmg` |
            | macOS | Apple Silicon (arm64) | `SandiRaksa-${{ steps.version.outputs.version }}-macos-arm64.dmg` |
            
            ### Installation
            
            **Windows:**
            1. Download `.exe` file
            2. Run the executable
            3. If Windows Defender warns, click "More info" → "Run anyway"
            
            **macOS:**
            1. Download `.dmg` file for your Mac type
            2. Open DMG and drag SandiRaksa to Applications
            3. If blocked by Gatekeeper, right-click → Open → Open
            
            ### What's New
            
            See [CHANGELOG.md](https://github.com/yuanyudistira/sandiraksa/blob/main/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
