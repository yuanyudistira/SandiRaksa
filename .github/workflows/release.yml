      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "installer-output" | Out-Null

          $appDir = (Resolve-Path "dist").Path

          Write-Host 'Application directory:'
          Write-Host $appDir
          Write-Host 'Building Windows installer...'
          Write-Host "Installer filename: $env:SETUP_FILENAME"

          & ISCC.exe "/DAppVersion=$env:APP_VERSION" "/DSignedAppDir=$appDir" "installer\SandiRaksa.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = "installer-output\$env:SETUP_FILENAME"

          if (-not (Test-Path $installer)) {
              throw "Expected installer was not generated: $installer"
          }

          $file = Get-Item $installer

          if ($file.Length -le 0) {
              throw "Generated installer is empty: $installer"
          }

          $sizeMB = [math]::Round($file.Length / 1MB, 2)

          Write-Host '========================================'
          Write-Host 'Windows installer successfully built'
          Write-Host "Path: $installer"
          Write-Host "Size: $sizeMB MB"
          Write-Host '========================================'